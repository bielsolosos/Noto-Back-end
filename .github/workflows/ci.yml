name: CI - Backend Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    
    services:
      # Sobe um banco temporário para os testes de integração
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: noto_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        # O health check garante que o banco esteja pronto antes dos testes começarem
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21' 
          distribution: 'temurin'
          cache: 'maven'

      - name: Rodar Testes e Gerar Relatório JaCoCo
        # Usamos o 'verify' para garantir que o JaCoCo gere o XML antes do Sonar subir os dados
        run: mvn -B clean verify
        env:
          # Variáveis para o Spring Boot conseguir conectar no banco do Service acima
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/noto_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: test

      - name: Análise com SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
          -Dsonar.projectKey=bielsolosos_Noto-Back-end \
          -Dsonar.organization=bielsolosos \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml