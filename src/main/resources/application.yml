spring:
  application:
    name: noto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/noto-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

r2:
  endpoint: ${R2_ENDPOINT:}
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  bucket-name: ${R2_BUCKET_NAME:}
  public-url-base: ${R2_PUBLIC_URL_BASE:}

noto:
  jwt:
    secret: ${JWT_SECRET:q9xAoDjLAZsb2eM8olOfxmDYn+0f7bRUIgNEN/l+Vjp5erGN64kzEF5hXGqdxpJ9XoJCIrposVrRmBLp2+TQxQ==}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
  registration-enabled: ${REGISTRATION_ENABLED:false}

resilience4j:
  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
      public-routes:
        limitForPeriod: 30
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      private-routes:
        limitForPeriod: 300
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
    instances:
      public-routes:
        limitForPeriod: 30
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      private-routes:
        limitForPeriod: 300
        limitRefreshPeriod: 1m
        timeoutDuration: 0s

logging:
  level:
    root: INFO
    "br.dev.bielsolosos.noto": ${LOG_LEVEL:DEBUG}
