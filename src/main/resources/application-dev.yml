spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true


logging:
  level:
    root: INFO
    "br.dev.bielsolosos.noto": DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
