spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/noto-test-db}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${TEST_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  test:
    database:
      replace: none

r2:
  endpoint: ${TEST_R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
  access-key: ${TEST_R2_ACCESS_KEY:test-access-key}
  secret-key: ${TEST_R2_SECRET_KEY:test-secret-key}
  bucket-name: ${TEST_R2_BUCKET_NAME:test-bucket}
  public-url-base: ${TEST_R2_PUBLIC_URL_BASE:https://cdn.example.com}

